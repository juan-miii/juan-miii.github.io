# See https://github.com/evilmartians/lefthook
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,astro,md,mdx,css,yml,yaml}"
      run: pnpm format:check
    lint:
      glob: "*.{ts,tsx,js,jsx,json,astro,md,mdx,css,yml,yaml}"
      run: pnpm lint
    content:
      glob: "apps/web/src/content/**/*"
      run: pnpm content:check
    typecheck:
      skip: true  # slower, run in pre-push
      run: pnpm typecheck
    gitleaks:
      skip: false
      run: 'if command -v gitleaks >/dev/null 2>&1; then gitleaks protect --staged --redact; else echo "warning: gitleaks not installed locally; skipping. CI still scans." >&2; fi'
  # Full check before push
pre-push:
  commands:
    full-check:
      run: pnpm check
    tests:
      skip: true
      run: pnpm test && pnpm test:e2e