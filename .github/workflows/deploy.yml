name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm content:check
      - run: pnpm turbo run check build --cache-dir=.turbo
      - run: node apps/web/scripts/smoke.test.mjs
      - name: Install Playwright Chromium
        run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - name: Accessibility and layout audit
        run: pnpm --filter @portfolio/web test:a11y
      - name: Create immutable package
        run: tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -czf portfolio.tar.gz -C apps/web dist
      - name: Compute digest
        run: sha256sum portfolio.tar.gz | tee portfolio.sha256
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/web/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: portfolio-package
          path: |
            portfolio.tar.gz
            portfolio.sha256
          retention-days: 30

  attest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: portfolio-package
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: portfolio.tar.gz

  verify:
    runs-on: ubuntu-latest
    needs: attest
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: portfolio-package
      - name: Verify package digest
        run: sha256sum -c portfolio.sha256
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify portfolio.tar.gz --owner "${{ github.repository_owner }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
