name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore Turborepo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm content:check
      - run: pnpm turbo run check build --cache-dir=.turbo
      - run: node apps/web/scripts/smoke.test.mjs
      - name: Install Playwright Chromium
        run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - name: Accessibility and layout audit
        run: pnpm --filter @portfolio/web test:a11y
      - name: Create immutable package
        run: tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -czf portfolio.tar.gz -C apps/web dist
      - name: Compute digest
        run: sha256sum portfolio.tar.gz | tee portfolio.sha256
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: portfolio-package
          path: |
            portfolio.tar.gz
            portfolio.sha256
          retention-days: 30

  attest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-package
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: portfolio.tar.gz

  verify:
    runs-on: ubuntu-latest
    needs: attest
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-package
      - name: Verify package digest
        run: sha256sum -c portfolio.sha256
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify portfolio.tar.gz --owner "${{ github.repository_owner }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
