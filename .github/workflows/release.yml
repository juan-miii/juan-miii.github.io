name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write  # Required for provenance attestation

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code (Lint, Typecheck, Tests)
        run: pnpm check

      - name: Create Release Pull Request or Publish to NPM
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm changeset publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  monorepo-release:
    name: Create monorepo platform release
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Version Packages')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create monorepo tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          TAG="v${ROOT_VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Monorepo release $TAG already exists."
            exit 0
          fi

          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists remotely (without release)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Monorepo platform release $TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Monorepo platform release $TAG" \
            --notes "Monorepo/platform version: $ROOT_VERSION. Package releases are published separately by Changesets."
