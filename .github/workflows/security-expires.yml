name: security-expires

on:
  schedule:
    - cron: "0 9 1 */3 *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: security-expires
  cancel-in-progress: false

jobs:
  propose:
    name: Propose security.txt expiry update
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Parse expiry and days remaining
        id: expiry
        run: |
          FILE=apps/web/public/.well-known/security.txt
          EXP=$(grep -i '^Expires:' "$FILE" | head -1 | sed -E 's/^Expires:\s*//i' | tr -d '\r '
            )
          if [ -z "$EXP" ]; then
            echo "No Expires field found; aborting." >&2
            exit 1
          fi
          NOW=$(date -u +%s)
          END=$(date -u -d "$EXP" +%s)
          DAYS=$(( (END - NOW) / 86400 ))
          echo "expires=$EXP" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "Current expiry: $EXP (in $DAYS days)"

      - name: Propose +1 year extension if near expiry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: fromJSON(steps.expiry.outputs.days) < 30 && fromJSON(steps.expiry.outputs.days) > -1
        run: |
          set -euo pipefail
          # already a pending PR?
          EXISTING=$(gh pr list --state open --label update-security-expires \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "A pending PR already exists: #$EXISTING. Skipping."
            exit 0
          fi
          CURRENT="${{ steps.expiry.outputs.expires }}"
          NEW_DATE=$(date -u -d "$CURRENT +1 year" +%Y-%m-%dT00:00:00.000Z)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/security-expires-update-$(date -u +%Y%m%d)"
          git checkout -b "$BRANCH"
          FILE=apps/web/public/.well-known/security.txt
          sed -i -E 's/^Expires:.*/Expires: '"$NEW_DATE"'/' "$FILE"
          test -s "$FILE"
          diff <(git show HEAD:"$FILE") "$FILE" >/dev/null && { echo "$FILE is unchanged; aborting." >&2; exit 1; }
          git add "$FILE"
          git commit -m "chore: refresh security.txt expiry to $NEW_DATE"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update security.txt expiry date" \
            --label update-security-expires \
            --body "$(printf '%s\n' \
              'The `security.txt` `Expires` field is within 30 days (currently `'"$CURRENT"'`).' \
              '' \
              'This PR extends it to `'"$NEW_DATE"'`.' \
              '' \
              '@juan-miii: reply **OK** or edit the file to confirm, or leave it; **if no' \
              'objection is raised and no edit is pushed within 14 days, this bot will' \
              'auto-merge it (squash). If you prefer to handle it manually, close the PR' \
              'and update `security.txt` yourself.')"

  auto-merge:
    name: Auto-merge old security.txt PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate and merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          expected_branch_re='^chore/security-expires-update-[0-9]{8}$'
          expected_base='main'
          expected_title='chore: update security.txt expiry date'
          expected_author='github-actions[bot]'
          expected_file='apps/web/public/.well-known/security.txt'
          now_epoch=$(date -u +%s)
          min_age_days=14

          open_prs=$(gh pr list --state open --label update-security-expires \
            --limit 100 --json number,createdAt,title,headRefName,baseRefName,author,isDraft,isCrossRepository)
          count=$(printf '%s' "$open_prs" | jq 'length')
          echo "Found $count open PR(s) with label update-security-expires."

          printf '%s' "$open_prs" | jq -c '.[]' | while IFS= read -r pr; do
            num=$(printf '%s' "$pr" | jq -r '.number')
            created=$(printf '%s' "$pr" | jq -r '.createdAt')
            title=$(printf '%s' "$pr" | jq -r '.title // ""')
            branch=$(printf '%s' "$pr" | jq -r '.headRefName // ""')
            base=$(printf '%s' "$pr" | jq -r '.baseRefName // ""')
            author=$(printf '%s' "$pr" | jq -r '.author.login // ""')
            draft=$(printf '%s' "$pr" | jq -r '.isDraft')
            cross=$(printf '%s' "$pr" | jq -r '.isCrossRepository')

            reject() {
              echo "PR #$num rejected: $1"
              continue
            }

            if [ "$base" != "$expected_base" ]; then
              reject "target branch is '$base', expected '$expected_base'"
              continue
            fi
            if [ "$title" != "$expected_title" ]; then
              reject "title is '$title', expected '$expected_title'"
              continue
            fi
            case "$branch" in
              chore/security-expires-update-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
              *)
                reject "branch '$branch' is not a security-expires update branch"
                continue
                ;;
            esac
            if [ "$author" != "$expected_author" ]; then
              reject "author is '$author', expected '$expected_author'"
              continue
            fi
            if [ "$draft" != "false" ]; then
              reject "PR is a draft"
              continue
            fi
            if [ "$cross" != "false" ]; then
              reject "PR is cross-repository"
              continue
            fi

            # The PR must not be concurrently merged/closed.
            live_state=$(gh pr view "$num" --json state,isDraft --jq '[.state, (.isDraft|tostring)] | join(":")')
            case "$live_state" in
              OPEN:false) ;;
              *) reject "live state is '$live_state', expected 'OPEN:false'"; continue ;;
            esac

            # Validate changed paths (also catches renames and multi-file PRs).
            changed_files=$(gh pr diff "$num" --name-only 2>/dev/null || true)
            normalized_files="$(printf '%s\n' "$changed_files" | sed -e '/^[[:space:]]*$/d')"
            if [ "$normalized_files" != "$expected_file" ]; then
              changed_summary="$(printf '%s' "$changed_files" | tr '\n' ' ')"
              reject "changed files are not exactly '$expected_file' (seen: $changed_summary)"
              continue
            fi

            body=$(gh pr view "$num" --json body --jq '.body // ""')
            case "$body" in
              *'security.txt'*) ;;
              *) reject "PR body does not mention security.txt"; continue ;;
            esac

            created_epoch=$(date -u -d "$created" +%s) || {
              reject "invalid createdAt value"
              continue
            }
            age=$(( (now_epoch - created_epoch) / 86400 ))
            if [ "$age" -ge "$min_age_days" ]; then
              echo "PR #$num is ${age}d old → merging."
              gh pr merge "$num" --squash --delete-branch \
                --subject "chore: refresh security.txt expiry" \
                --body "Auto-merged after $age days without objections."
              gh pr comment "$num" --body "Auto-merged by security-expires workflow: $age days elapsed without objections."
            else
              echo "PR #$num is only ${age}d old → deferring."
            fi
          done