documentation:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"

github_actions:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

config:
  - changed-files:
      - any-glob-to-any-file:
          [
            ".gitignore",
            "astro.config.mjs",
            "tailwind.config.mjs",
            "tsconfig.json",
          ]

bump-patch:
  - changed-files:
      - any-glob-to-any-file: "astro.config.mjs"
      - any-glob-to-any-file: "tailwind.config.mjs"
      - any-glob-to-any-file: "tsconfig.json"
